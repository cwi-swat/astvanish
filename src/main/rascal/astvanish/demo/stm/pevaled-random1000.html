
<html>
<head>
<script type="module">
  import * as bench from '/bench.js';
  import { run } from './random1000-run.js';
  import { initialState } from './random1000-initialState.js';
  import events from './random1000-events.json' with {type: 'json'};
  
  bench.start();
  var state = {current: initialState()};
  for (let i = 0; i < 50; i++) {
    for (const e of events.events) {
      console.log('event: ' + e);
      run(state, e);
      console.log('state = ' + state.current);
      var elt = document.createElement('div');
      elt.appendChild(document.createTextNode(state.current));
      document.body.appendChild(elt);
    }
  }
  bench.stop();
</script>
</head>
<body>

</body>
</html>
