<script type="module">
  import * as bench from '/bench.js';

  // hand-written JS equivalent of bench(n) in benchmark.func
  function fib(n) {
    return n < 2 ? n : fib(n - 1) + fib(n - 2);
  }

  function tak(x, y, z) {
    return !(y < x) ? z : tak(tak(x - 1, y, z), tak(y - 1, z, x), tak(z - 1, x, y));
  }

  function collatz(n, steps) {
    if (n === 1) return steps;
    return n % 2 === 0 ? collatz(Math.trunc(n / 2), steps + 1) : collatz(3 * n + 1, steps + 1);
  }

  function noDivisor(n, d) {
    return d * d > n || n % d !== 0 && noDivisor(n, d + 1);
  }

  function isPrime(n) {
    return n >= 2 && noDivisor(n, 2);
  }

  function sumCollatz(lo, hi) {
    if (lo >= hi) return collatz(lo, 0);
    const mid = Math.trunc((lo + hi) / 2);
    return sumCollatz(lo, mid) + sumCollatz(mid + 1, hi);
  }

  function countPrimes(lo, hi) {
    if (lo >= hi) return isPrime(lo) === true ? 1 : 0;
    const mid = Math.trunc((lo + hi) / 2);
    return countPrimes(lo, mid) + countPrimes(mid + 1, hi);
  }

  function abs(x) {
    return x <= 0 ? -x : x;
  }

  function benchmark(n) {
    const calls = fib(n) + tak(Math.trunc(n / 2), Math.trunc(n / 3), Math.trunc(n / 6));
    const arith = sumCollatz(1, n * 100) - countPrimes(1, n * 100);
    return abs(arith - calls) % 1000000;
  }

  bench.start();
  benchmark(10);
  bench.stop();
</script>
